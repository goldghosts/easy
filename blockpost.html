    <script>
      const overlay = document.getElementById("overlay");
      const embeddedPage = document.getElementById("embedded-page");

      function togglePage(url) {
        if (overlay.style.display === "none") {
          embeddedPage.src = url;
          overlay.style.display = "block";
        } else {
          overlay.style.display = "none";
        }
      }

      document.addEventListener("keypress", function (event) {
        if (event.key === "2" || event.key === "2") {
          openInNewTab();

        var iframe = document.createElement("iframe");

          "position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; user-select: none;";

          window.location.href = "https://www.education.com";
